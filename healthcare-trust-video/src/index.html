<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Simple Enough to Trust</title>
<style>
  @font-face { font-family: Inter; src: url(fonts/Inter-400.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(fonts/Inter-500.ttf); font-weight: 500; }
  @font-face { font-family: Inter; src: url(fonts/Inter-600.ttf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(fonts/Inter-700.ttf); font-weight: 700; }
  @font-face { font-family: Inter; src: url(fonts/Inter-800.ttf); font-weight: 800; }
  @font-face { font-family: Fraunces; src: url(fonts/Fraunces-600.ttf); font-weight: 600; }
  @font-face { font-family: Fraunces; src: url(fonts/Fraunces-700.ttf); font-weight: 700; }
  @font-face { font-family: Mono; src: url(fonts/Mono-400.ttf); font-weight: 400; }
  @font-face { font-family: Mono; src: url(fonts/Mono-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<script src="timing.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   "Simple Enough to Trust" — 60s explainer, rendered frame-by-frame.
   render(t) is a pure function of time t (seconds), so the capture
   script can step through it deterministically at any frame rate.
   ============================================================ */
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- palette ----------
const C = {
  night: '#0D1220', night2: '#151C2E', nightLine: '#27314A',
  paper: '#F4EFE6', paper2: '#EAE3D6', paperLine: '#D8CFBF',
  ink: '#111827', inkSoft: '#4B5563', fog: '#8A93A6', fogLight: '#C9CFDA',
  red: '#FF5A4E', redDeep: '#D93A2F', amber: '#FFB547',
  teal: '#14B89C', tealDeep: '#0B8C77', blue: '#4C7DFF',
};

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eElastic = k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }

// ---------- timeline helpers ----------
const SC = {}; TIMING.scenes.forEach((s, i) => { s.i = i; SC[s.id] = s; });
const TXT = {}; // filled from caps
TIMING.scenes.forEach(s => TXT[s.id] = s.caps.map(c => c[2]).join(' '));
// time at which a phrase is spoken (character-proportional estimate)
function wt(id, sub) {
  const s = SC[id], txt = TXT[id], i = txt.indexOf(sub);
  if (i < 0) throw new Error('phrase not found: ' + sub);
  return s.start + s.dur * i / txt.length;
}
const LEAD = 0.25;
function win(id) {
  const s = SC[id], nx = TIMING.scenes[s.i + 1];
  return [s.i === 0 ? 0 : s.start - LEAD, nx ? nx.start - LEAD : TIMING.total];
}

// ---------- drawing primitives ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(size, weight = 500, fam = 'Inter') { return `${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.size || 32, o.weight || 500, o.fam || 'Inter');
  ctx.fillStyle = o.color || C.paper;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}
function measure(s, size, weight = 500, fam = 'Inter', ls = 0) {
  ctx.save(); ctx.font = font(size, weight, fam); if (ls) ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function wrap(s, maxW, size, weight = 500, fam = 'Inter') {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const tryL = cur ? cur + ' ' + w : w;
    if (measure(tryL, size, weight, fam) > maxW && cur) { lines.push(cur); cur = w; } else cur = tryL;
  }
  if (cur) lines.push(cur);
  return lines;
}
// text that rises in word-by-word
function riseText(s, x, y, k, o = {}) {
  const words = s.split(' '); let cx = x;
  const size = o.size || 32, space = measure(' ', size, o.weight || 500, o.fam || 'Inter');
  if (o.align === 'center') cx = x - measure(s, size, o.weight || 500, o.fam || 'Inter') / 2;
  words.forEach((w, i) => {
    const kk = eOut(clamp(k * (words.length * .35 + 1) - i * .35));
    const ww = text(w, cx, y + (1 - kk) * size * .6, { ...o, align: 'left', alpha: (o.alpha ?? 1) * kk });
    cx += ww + space;
  });
}
function withAlpha(a, fn) { ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
function tr(x, y, rot, sc, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(sc ?? 1, sc ?? 1); fn(); ctx.restore(); }
function shadow(blur, oy, col = 'rgba(0,0,0,.35)') { ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }

function checkMark(x, y, s, k, col, lw = 6) {
  if (k <= 0) return;
  const pts = [[-.45, 0], [-.12, .32], [.5, -.35]];
  const L1 = Math.hypot(.33, .32), L2 = Math.hypot(.62, .67), tot = L1 + L2;
  let d = k * tot;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  const a = Math.min(d, L1) / L1; ctx.lineTo(x + lerp(pts[0][0], pts[1][0], a) * s, y + lerp(pts[0][1], pts[1][1], a) * s);
  if (d > L1) { const b = (d - L1) / L2; ctx.lineTo(x + lerp(pts[1][0], pts[2][0], b) * s, y + lerp(pts[1][1], pts[2][1], b) * s); }
  ctx.stroke(); ctx.restore();
}
function stamp(label, x, y, rot, sc, col, size = 44) {
  tr(x, y, rot, sc, () => {
    ctx.font = font(size, 800); ctx.letterSpacing = '3px';
    const w = ctx.measureText(label).width + 44, h = size + 30;
    ctx.fillStyle = 'rgba(244,239,230,.92)'; rr(-w / 2, -h / 2, w, h, 10); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 6; rr(-w / 2, -h / 2, w, h, 10); ctx.stroke();
    ctx.lineWidth = 2; rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 6); ctx.stroke();
    ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 3);
  });
}

// ---------- props ----------
function envelope(x, y, rot, label, col) {
  tr(x, y, rot, 1, () => {
    shadow(30, 14);
    ctx.fillStyle = C.paper; rr(-180, -110, 360, 220, 10); ctx.fill(); noShadow();
    ctx.strokeStyle = C.paperLine; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-180, -100); ctx.lineTo(0, 20); ctx.lineTo(180, -100); ctx.stroke();
    ctx.fillStyle = C.paper2; rr(-150, 30, 170, 48, 6); ctx.fill();
    ctx.fillStyle = C.fogLight; for (let i = 0; i < 3; i++) { rr(-140, 38 + i * 13, 120 - i * 25, 6, 3); ctx.fill(); }
    ctx.save(); ctx.translate(95, 52); ctx.rotate(-.12);
    ctx.font = font(18, 800); ctx.letterSpacing = '1.5px';
    const w = ctx.measureText(label).width + 20;
    ctx.strokeStyle = col; ctx.lineWidth = 3; rr(-w / 2, -16, w, 32, 4); ctx.stroke();
    ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 1);
    ctx.restore();
  });
}
// a messy medical bill
function billDoc(x, y, rot, sc, d) {
  tr(x, y, rot, sc, () => {
    const w = 380, h = 520;
    shadow(40, 18);
    ctx.fillStyle = C.paper; rr(-w / 2, -h / 2, w, h, 8); ctx.fill(); noShadow();
    ctx.fillStyle = d.col; rr(-w / 2, -h / 2, w, 70, [8, 8, 0, 0]); ctx.fill();
    text(d.head, -w / 2 + 22, -h / 2 + 32, { size: 17, weight: 800, color: '#fff', ls: 1.5 });
    text(d.sub, -w / 2 + 22, -h / 2 + 55, { size: 14, weight: 500, color: 'rgba(255,255,255,.8)' });
    let yy = -h / 2 + 108;
    d.lines.forEach(([a, b]) => {
      text(a, -w / 2 + 22, yy, { size: 15, fam: 'Mono', color: C.inkSoft });
      text(b, w / 2 - 22, yy, { size: 15, fam: 'Mono', color: C.ink, align: 'right' });
      yy += 30;
    });
    ctx.fillStyle = C.paperLine; ctx.fillRect(-w / 2 + 22, h / 2 - 118, w - 44, 2);
    text(d.dueLabel, -w / 2 + 22, h / 2 - 78, { size: 16, weight: 600, color: C.inkSoft });
    text(d.due, -w / 2 + 22, h / 2 - 34, { size: 40, weight: 800, color: C.ink });
  });
}
const BILLS = [
  { head: 'COUNTY GENERAL HOSPITAL', sub: 'Statement · Acct 88-40213-7', col: '#3A4A6B', dueLabel: 'PATIENT BALANCE DUE', due: '$4,812.00',
    lines: [['REV 0450 ER LVL5', '$3,120.00'], ['REV 0350 CT SCAN', '$2,480.50'], ['REV 0250 PHARMACY', '$212.75'], ['ADJ CO-45', '−$2,104.25'], ['PR-1 DEDUCTIBLE', '$1,500.00'], ['PR-2 COINSURANCE', '$603.00'], ['FAC FEE (SITE)', '$1,000.00']] },
  { head: 'PHYSICIAN GROUP', sub: 'Invoice · Provider NPI 1629…', col: '#6B4A7A', dueLabel: 'AMOUNT DUE', due: '$1,245.00',
    lines: [['CPT 99285-25', '$1,410.00'], ['CPT 70450-26', '$386.00'], ['MOD -25 / -26', '—'], ['PAYER ADJ', '−$551.00'], ['OUT-OF-NTWK?', 'PENDING'], ['BAL BILL', '$0.00*'], ['*SEE REVERSE', '']] },
  { head: 'LAB SERVICES INC.', sub: 'Invoice · Req # L-5520-XQ', col: '#7A5A2E', dueLabel: 'PLEASE PAY', due: '$389.17',
    lines: [['CPT 80053 CMP', '$148.00'], ['CPT 85025 CBC', '$96.00'], ['CPT 84484 TROP', '$231.40'], ['CPT 36415 DRAW', '$34.00'], ['ALLOWED AMT', '$120.23'], ['DENIED: CO-197', '$389.17'], ['AUTH REQ\'D', 'Y']] },
  { head: 'YOUR HEALTH PLAN', sub: 'Explanation of Benefits', col: '#2F6B64', dueLabel: 'AMOUNT YOU MAY OWE', due: '$ ? ? ?',
    lines: [['CLAIM 24-0917-A', 'PROCESSED'], ['BILLED', '$7,209.25'], ['ALLOWED', '$3,487.11'], ['PLAN PAID', '$1,384.11'], ['NOT COVERED', 'SEE CODE 4'], ['REMARK N130', '—'], ['REMARK MA01', '—']] },
];

// ============================================================
//   SCENES
// ============================================================

// ---- s1: the envelopes arrive ----
function sceneS1(t) {
  const tHead = 0.25, tEnv = wt('s1', 'Then');
  riseText('You got care.', 150, 470, seg(t, tHead, tHead + .7), { size: 104, weight: 700, fam: 'Fraunces', color: C.paper });
  riseText('Then came the envelopes.', 150, 600, seg(t, tEnv, tEnv + .8), { size: 64, weight: 600, fam: 'Fraunces', color: C.red });
  const labels = ['STATEMENT', 'PAST DUE', 'INVOICE', 'FINAL NOTICE', 'EOB', 'BALANCE DUE', 'ACTION REQUIRED'];
  const r = rng(7);
  for (let i = 0; i < 7; i++) {
    const t0 = tEnv + .1 + i * .13, k = seg(t, t0, t0 + .55);
    if (k <= 0) continue;
    const px = 1380 + (r() - .5) * 360, py = 560 + (r() - .5) * 300, rot = (r() - .5) * .6;
    const y = lerp(-260, py, eBack(k));
    envelope(px, y, rot * eOut(k) + (1 - k) * .8, labels[i], i % 2 ? C.red : C.redDeep);
  }
}

// ---- s2: four bills, zero answers ----
function sceneS2(t, a, b) {
  const beats = [wt('s2', 'A hospital'), wt('s2', 'A doctor'), wt('s2', 'A lab'), wt('s2', 'And a letter')];
  const tStamp = wt('s2', 'this is not') + .15;
  const shake = t > tStamp ? Math.exp(-(t - tStamp) * 9) * 14 : 0;
  ctx.save(); ctx.translate(Math.sin(t * 90) * shake, Math.cos(t * 70) * shake);
  // envelopes sliding away
  withAlpha(1 - seg(t, a, a + .4), () => {
    const r = rng(7);
    for (let i = 0; i < 7; i++) { const px = 1380 + (r() - .5) * 360, py = 560 + (r() - .5) * 300, rot = (r() - .5) * .6;
      envelope(px + eIn(seg(t, a, a + .4)) * 700, py, rot, '', C.red); }
  });
  const xs = [262, 682, 1102, 1522], rots = [-.05, .03, -.02, .045];
  beats.forEach((bt, i) => {
    const k = seg(t, bt - .1, bt + .45);
    if (k <= 0) return;
    billDoc(xs[i], lerp(1300, 505, eBack(k)), rots[i] * (2 - eOut(k)), 1, BILLS[i]);
  });
  // "THIS IS NOT A BILL"
  const ks = seg(t, tStamp - .12, tStamp);
  if (ks > 0) {
    withAlpha(ks, () => stamp('THIS IS NOT A BILL', xs[3] - 20, 520, -.22, lerp(2.6, 1.1, eIn(ks)), C.red, 38));
  }
  ctx.restore();
  const kq = seg(t, tStamp + .5, tStamp + 1.1);
  riseText('4 senders · 4 formats · 0 straight answers', W / 2, 125, kq, { size: 40, weight: 600, align: 'center', color: C.amber });
}

// ---- s3: $4.9T, and the slice lost to complexity ----
function sceneS3(t, a, b) {
  const tWaste = wt('s3', 'and over');
  const kIn = seg(t, a + .1, a + 1.2);
  // big number
  const val = lerp(0, 4.9, eOut(seg(t, a + .2, a + 1.8)));
  withAlpha(eOut(kIn), () => {
    text('U.S. HEALTH SPENDING, PER YEAR', 150, 285, { size: 22, weight: 700, color: C.fog, ls: 3 });
    text('$' + val.toFixed(1) + ' trillion', 150, 405, { size: 120, weight: 700, fam: 'Fraunces', color: C.paper });
    text('≈ 17.6% of GDP · CMS National Health Expenditures, 2023', 150, 455, { size: 24, weight: 500, color: C.fog });
  });
  const kW = seg(t, tWaste, tWaste + .8);
  withAlpha(eOut(kW), () => {
    text('LOST TO ADMINISTRATIVE COMPLEXITY', 150, 590, { size: 22, weight: 700, color: C.red, ls: 3 });
    const v = Math.round(lerp(0, 265, eOut(seg(t, tWaste, tWaste + 1.4))));
    text('$' + v + ' billion', 150 - (1 - eOut(kW)) * 40, 705, { size: 120, weight: 700, fam: 'Fraunces', color: C.red });
    text('Billing, coding, prior auth & claims friction — every year', 150, 755, { size: 24, weight: 500, color: C.fog });
    text('Estimate: Shrank, Rogstad & Parekh, JAMA 2019', 150, 790, { size: 20, weight: 500, color: C.fog, alpha: .7 });
  });
  // unit chart: 100 squares = $4.9T; ~5.4 squares = $265B
  const gx = 1150, gy = 220, s = 54, g = 10;
  for (let i = 0; i < 100; i++) {
    const r = Math.floor(i / 10), c = i % 10;
    const kk = eBack(seg(t, a + .15 + (r + c) * .045, a + .55 + (r + c) * .045));
    if (kk <= 0) continue;
    const x = gx + c * (s + g), y = gy + r * (s + g);
    const cx = x + s / 2, cy = y + s / 2, ss = s * kk;
    ctx.fillStyle = C.nightLine; rr(cx - ss / 2, cy - ss / 2, ss, ss, 8); ctx.fill();
    const waste = i < 5 ? 1 : i === 5 ? .42 : 0;
    const kr = eOut(seg(t, tWaste + .1 + i * .08, tWaste + .5 + i * .08));
    if (waste && kr > 0) {
      ctx.save(); rr(cx - ss / 2, cy - ss / 2, ss, ss, 8); ctx.clip();
      const pulse = 1 + .08 * Math.sin((t - tWaste) * 6) * Math.exp(-(t - tWaste) * .8);
      ctx.fillStyle = C.red; ctx.fillRect(cx - ss / 2, cy - ss / 2, ss * waste * kr * pulse, ss);
      ctx.restore();
    }
  }
  withAlpha(seg(t, a + 1, a + 1.6), () => {
    text('each square ≈ $49 billion', gx, gy + 10 * (s + g) + 30, { size: 22, weight: 500, color: C.fog });
  });
}

// ---- s4: three symptoms ----
function panel(x, y, w, h, k, title, col) {
  const yy = y + (1 - eOut(k)) * 60;
  ctx.save(); ctx.globalAlpha *= eOut(k);
  ctx.fillStyle = C.night2; rr(x, yy, w, h, 22); ctx.fill();
  ctx.strokeStyle = C.nightLine; ctx.lineWidth = 2; ctx.stroke();
  text(title, x + 36, yy + 58, { size: 20, weight: 700, color: col, ls: 3 });
  ctx.restore();
  return yy;
}
function sceneS4(t, a, b) {
  const b1 = wt('s4', 'The same'), b2 = wt('s4', 'One in five'), b3 = wt('s4', 'A hundred');
  const PW = 540, PH = 640, PY = 190, xs = [120, 690, 1260];
  // A: price spread
  let k = seg(t, b1 - .2, b1 + .5);
  if (k > 0) {
    const y = panel(xs[0], PY, PW, PH, k, 'SAME MRI · SAME CITY', C.amber);
    const prices = [['Imaging center', 450], ['Hospital B', 980], ['Hospital C', 1650], ['Hospital D', 2900]];
    prices.forEach(([n, p], i) => {
      const kb = eOut(seg(t, b1 + .2 + i * .15, b1 + .9 + i * .15));
      const by = y + 110 + i * 78;
      text(n, xs[0] + 36, by, { size: 20, weight: 500, color: C.fogLight });
      ctx.fillStyle = i === 3 ? C.red : i === 0 ? C.teal : '#56627E';
      rr(xs[0] + 36, by + 12, 400 * p / 2900 * kb, 26, 6); ctx.fill();
      text('$' + Math.round(p * kb).toLocaleString(), xs[0] + 36 + 400 * p / 2900 * kb + 12, by + 33, { size: 20, weight: 700, color: C.paper, alpha: kb });
    });
    withAlpha(seg(t, b1 + 1, b1 + 1.4), () => {
      text('6×', xs[0] + 36, y + 505, { size: 96, weight: 700, fam: 'Fraunces', color: C.amber });
      text('price gap for the', xs[0] + 60 + measure('6×', 96, 700, 'Fraunces'), y + 470, { size: 24, weight: 500, color: C.fogLight });
      text('same scan', xs[0] + 60 + measure('6×', 96, 700, 'Fraunces'), y + 502, { size: 24, weight: 500, color: C.fogLight });
      text('Illustrative prices; multi-fold local spreads are common', xs[0] + 36, y + 600, { size: 16, weight: 500, color: C.fog });
    });
  }
  // B: 1 in 5 claims denied
  k = seg(t, b2 - .2, b2 + .5);
  if (k > 0) {
    const y = panel(xs[1], PY, PW, PH, k, 'CLAIMS DENIED', C.red);
    for (let i = 0; i < 5; i++) {
      const kd = eBack(seg(t, b2 + i * .1, b2 + .45 + i * .1));
      const cx = xs[1] + 78 + i * 96, cy = y + 250;
      tr(cx, cy + (1 - kd) * 40, 0, kd, () => {
        ctx.fillStyle = i === 2 ? '#3A2226' : '#222B40'; rr(-38, -60, 76, 120, 8); ctx.fill();
        ctx.fillStyle = i === 2 ? '#6B3A3A' : '#3A4661';
        for (let j = 0; j < 5; j++) { rr(-26, -42 + j * 16, j % 2 ? 36 : 52, 6, 3); ctx.fill(); }
      });
      if (i !== 2) checkMark(cx, cy + 90, 36, seg(t, b2 + .6 + i * .08, b2 + .9 + i * .08), C.teal, 5);
    }
    const kst = seg(t, b2 + .9, b2 + 1.05);
    if (kst > 0) withAlpha(kst, () => stamp('DENIED', xs[1] + 270, y + 250, -.25, lerp(2, 1, eIn(kst)), C.red, 30));
    withAlpha(seg(t, b2 + 1, b2 + 1.4), () => {
      text('1 in 5', xs[1] + 36, y + 505, { size: 96, weight: 700, fam: 'Fraunces', color: C.red });
      text('in-network claims', xs[1] + 60 + measure('1 in 5', 96, 700, 'Fraunces'), y + 470, { size: 24, weight: 500, color: C.fogLight });
      text('denied', xs[1] + 60 + measure('1 in 5', 96, 700, 'Fraunces'), y + 502, { size: 24, weight: 500, color: C.fogLight });
      text('HealthCare.gov insurers, 2023 · KFF', xs[1] + 36, y + 600, { size: 16, weight: 500, color: C.fog });
    });
  }
  // C: 100M people with medical debt (330 dots ≈ U.S. population)
  k = seg(t, b3 - .2, b3 + .5);
  if (k > 0) {
    const y = panel(xs[2], PY, PW, PH, k, 'CARRY MEDICAL DEBT', C.red);
    const r = rng(42), debt = new Set();
    while (debt.size < 100) debt.add(Math.floor(r() * 330));
    for (let i = 0; i < 330; i++) {
      const row = Math.floor(i / 22), col = i % 22;
      const cx = xs[2] + 52 + col * 21.5, cy = y + 110 + row * 21.5;
      const kd = seg(t, b3 + (col + row) * .012, b3 + .3 + (col + row) * .012);

const SCENES = { s1: sceneS1, s2: sceneS2, s3: sceneS3, s4: sceneS4, s5: sceneS5, s6: sceneS6, s7: sceneS7, s8: sceneS8, s9: sceneS9, s10: sceneS10 };
const CHAPTERS = [['s1', 'THE BILL'], ['s3', 'THE COST'], ['s4', 'THE SYMPTOMS'], ['s5', 'THE TRUST GAP'], ['s6', 'THE REDESIGN']];

function background(t) {
  const f = wt('s6', 'So let');
  ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1200);
  g.addColorStop(0, 'rgba(76,125,255,0.06)'); g.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const k = eIO(seg(t, f, f + .9));
  if (k > 0) {
    ctx.save(); ctx.beginPath(); ctx.arc(1590, 540, 2300 * k, 0, 7); ctx.clip();
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}
function isLight(t) { return t > wt('s6', 'So let') + .6; }

function captions(t) {
  for (const s of TIMING.scenes) for (const [c0, c1, str] of s.caps) {
    if (t < c0 - .05 || t > c1 + .1) continue;
    const k = Math.min(seg(t, c0 - .05, c0 + .1), 1 - seg(t, c1, c1 + .1));
    const size = 30, w = measure(str, size, 600) + 48;
    withAlpha(k, () => {
      ctx.fillStyle = 'rgba(8,11,20,.78)'; rr(W / 2 - w / 2, 985, w, 56, 14); ctx.fill();
      text(str, W / 2, 1022, { size, weight: 600, color: '#fff', align: 'center' });
    });
  }
}
function chrome(t) {
  const light = isLight(t);
  let ch = CHAPTERS[0][1];
  for (const [id, n] of CHAPTERS) if (t >= win(id)[0]) ch = n;
  const col = light ? C.inkSoft : C.fog;
  ctx.fillStyle = light ? C.tealDeep : C.red; ctx.beginPath(); ctx.arc(64, 62, 7, 0, 7); ctx.fill();
  text(ch, 84, 70, { size: 18, weight: 700, color: col, ls: 3 });
  text('SIMPLE ENOUGH TO TRUST', W - 60, 70, { size: 18, weight: 700, color: col, ls: 3, align: 'right', alpha: .7 });
  ctx.fillStyle = light ? 'rgba(17,24,39,.08)' : 'rgba(255,255,255,.08)'; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = light ? C.teal : C.red; ctx.fillRect(0, H - 6, W * t / TIMING.total, 6);
}

function render(t) {
  ctx.save();
  background(t);
  for (const id in SCENES) {
    const [a, b] = win(id);
    const isLast = id === 's10';
    if (t < a - .01 || t > b + .35) continue;
    const alpha = Math.min(id === 's1' ? 1 : seg(t, a - .05, a + .3), isLast ? 1 : 1 - seg(t, b, b + .35));
    withAlpha(alpha, () => SCENES[id](t, a, b));
  }
  chrome(t);
  captions(t);
  // opening/closing fades
  const fo = Math.max(1 - seg(t, 0, .35), seg(t, TIMING.total - .45, TIMING.total));
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
window.render = render;
window.ready = document.fonts.ready.then(() => Promise.all(
  ['400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter', '600 20px Fraunces', '700 20px Fraunces', '400 20px Mono', '600 20px Mono']
    .map(f => document.fonts.load(f)))).then(() => true);
const q = new URLSearchParams(location.search).get('t');
window.ready.then(() => render(q ? +q : 12));
</script>
